<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width" />
    <style>/* TEST_STYLES */</style>
  </head>
  <body>
    <main id="app" class="auth-shell">
      <section class="auth-card" aria-labelledby="sign-in-title">
        <span class="brand">e6irc</span>
        <p class="eyebrow">Welcome back</p>
        <h1 id="sign-in-title">Sign in to e6irc</h1>
        <p class="lede">Connect to your networks and conversations.</p>
        <form class="login-form">
          <label><span>Account</span><input autocomplete="username" value="visual-test" /></label>
          <label><span>Password</span><input type="password" autocomplete="current-password" value="password" /></label>
          <button class="primary-action" type="submit">Sign in</button>
        </form>
      </section>
    </main>
  </body>
</html>
