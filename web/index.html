<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/src/favicon.svg" />
    <title>e6irc</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main id="app">
      <header id="topbar">
        <a id="brand" href="/">e6irc</a>
        <button
          id="sidebar-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="sidebar"
        >Conversations</button>
        <label id="network-control">
          <span>Network</span>
          <select id="network-select" aria-label="Active network">
            <option value="">Choose a network</option>
          </select>
        </label>
        <span id="status" class="status status-connecting" role="status" aria-live="polite">starting…</span>
        <details id="settings">
          <summary>Preferences</summary>
          <div class="settings-menu">
            <label>
              <span>Theme</span>
              <select id="theme-select">
                <option value="auto">System</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
              </select>
            </label>
            <button id="notify-toggle" type="button">Desktop notifications: off</button>
            <span id="storage-state" class="settings-note" hidden></span>
          </div>
        </details>
        <nav id="user-nav" aria-label="User">
          <a id="manage-link" href="/console/networks">Manage</a>
          <a id="account-link" href="/console/account" aria-label="Open my account">
            <span id="account-name" aria-live="polite">signed in</span>
            <span id="account-role" class="user-role" aria-live="polite"></span>
          </a>
          <a id="logout-link" data-shauth-sign-out href="/api/v1/auth/logout">Sign out</a>
        </nav>
      </header>

      <div id="alerts" aria-live="polite" aria-relevant="additions text"></div>

      <div id="workspace">
        <!-- Buffer list: the server buffer plus one per channel / DM. -->
        <aside id="sidebar" aria-label="Buffers">
          <div class="side-head">Buffers</div>
          <form id="join-form" autocomplete="off">
            <input type="text" id="join-input" placeholder="join #channel" aria-label="Join a channel" autocomplete="off" />
            <button type="submit" title="Join channel" disabled>+</button>
          </form>
          <ul id="buffers"></ul>
        </aside>

        <section id="chatpane">
          <div id="bufhead">
            <span id="bufname">—</span>
            <span id="buftopic" class="topic"></span>
            <button id="buffer-action" type="button" hidden>Close</button>
          </div>
          <button id="load-earlier" type="button" hidden>Load earlier messages</button>
          <ol id="messages"></ol>
          <form id="composer" autocomplete="off">
            <input
              type="text"
              id="message"
              placeholder="message… (/join #chan, /msg nick text, /raw LINE)"
              maxlength="510"
              autocomplete="off"
              autofocus
              disabled
            />
            <button type="submit" disabled>Send</button>
          </form>
        </section>

        <!-- Channel member list; hidden for the server buffer and DMs. -->
        <aside id="nicklist" aria-label="Members" hidden>
          <div class="side-head"><span id="nickcount">0</span> members</div>
          <ul id="nicks"></ul>
        </aside>
      </div>
    </main>
  </body>
</html>
