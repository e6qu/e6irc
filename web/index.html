<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>e6irc</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main id="app">
      <header id="topbar">
        <span id="brand">e6irc</span>
        <span id="status" class="status status-connecting">connecting…</span>
        <nav id="user-nav" aria-label="User">
          <a id="account-link" href="/account" aria-label="Open my account">
            <span id="account-name" aria-live="polite">signed in</span>
            <span id="account-role" class="user-role" aria-live="polite"></span>
          </a>
          <a id="logout-link" data-shauth-sign-out href="/api/v1/auth/logout">Sign out</a>
        </nav>
      </header>

      <div id="workspace">
        <!-- Buffer list: the server buffer plus one per channel / DM. -->
        <aside id="sidebar" aria-label="Buffers">
          <div class="side-head">Buffers</div>
          <form id="join-form" autocomplete="off">
            <input type="text" id="join-input" placeholder="join #channel" aria-label="Join a channel" autocomplete="off" />
            <button type="submit" title="Join channel">+</button>
          </form>
          <ul id="buffers"></ul>
        </aside>

        <section id="chatpane">
          <div id="bufhead">
            <span id="bufname">—</span>
            <span id="buftopic" class="topic"></span>
          </div>
          <ol id="messages"></ol>
          <form id="composer" autocomplete="off">
            <input
              type="text"
              id="message"
              placeholder="message… (/join #chan, /msg nick text, /raw LINE)"
              autocomplete="off"
              autofocus
            />
            <button type="submit">Send</button>
          </form>
        </section>

        <!-- Channel member list; hidden for the server buffer and DMs. -->
        <aside id="nicklist" aria-label="Members" hidden>
          <div class="side-head"><span id="nickcount">0</span> members</div>
          <ul id="nicks"></ul>
        </aside>
      </div>
    </main>
  </body>
</html>
