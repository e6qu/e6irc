# Conduit: a lightweight single-binary Matrix homeserver, the live target
# for the `matrix` bridge's integration test. CI's matrix-bridge job runs the
# same pinned image with `docker run`, mounting this directory's conduit.toml;
# this file starts it the same way for a developer. The image comes from
# Google's Docker Hub mirror at the digest Docker Hub serves: Docker Hub limits
# anonymous pulls per address.
services:
  conduit:
    image: mirror.gcr.io/matrixconduit/matrix-conduit:v0.10.15@sha256:cb4deab33ea1a6da919a0ea99e76be75d6af5936623fd9dde442a17e2d0b320f
    environment:
      CONDUIT_CONFIG: "/etc/conduit.toml"
    volumes:
      - "./conduit.toml:/etc/conduit.toml:ro"
    ports:
      - "127.0.0.1:16167:6167"
