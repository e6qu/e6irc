# The image ships every bridge and the embedded web client, so the policy is
# judged over the all-features dependency graph locally as CI does; the
# default-feature graph (`default = []`) would never see the bridge trees.
[graph]
all-features = true

# cargo-deny configuration. Licenses must be AGPL-3.0-or-later compatible.

[licenses]
allow = [
    "AGPL-3.0-or-later", # our own crates
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    # webpki-roots ships the Mozilla CA bundle under this permissive
    # data license (no copyleft); AGPL-compatible. Data, not code.
    "CDLA-Permissive-2.0",
]

# libfuzzer-sys bundles LLVM's libFuzzer runtime, part of which is under the
# NCSA licence: permissive, OSI-approved, FSF-free, and GPL-compatible. It is
# allowed for that crate alone. The crate is in the `fuzz/` package only — a
# test harness that is never compiled into a shipped binary — and that
# manifest is checked against this same policy in CI. The workspace check
# therefore reports this exception as not encountered; that warning is expected.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

[bans]
# Transitive minor/patch version duplication is unavoidable across a
# large tree (sqlx + openidconnect + argon2 pull differing versions of
# shared low-level crates); surface it as a warning rather than a hard
# fail. The hard bans below are the load-bearing policy.
multiple-versions = "warn"
# OpenSSL is banned by design: rustls is the single TLS stack (DESIGN §5).
deny = [
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "native-tls" },
    # One of each network stack in the binary (DESIGN §1), enforced rather than
    # warned about. A direct dependency that gets ahead of what axum or the
    # openidconnect chain still uses is held back in its manifest until they
    # move: tokio-tungstenite stays on 0.29 while axum 0.8 serves WebSockets
    # through it, and reqwest on 0.12 while oauth2 5 does.
    { crate = "tokio-tungstenite", deny-multiple-versions = true },
    { crate = "tungstenite", deny-multiple-versions = true },
    { crate = "reqwest", deny-multiple-versions = true },
    { crate = "hyper", deny-multiple-versions = true },
    { crate = "axum", deny-multiple-versions = true },
    { crate = "rustls", deny-multiple-versions = true },
    { crate = "tokio-rustls", deny-multiple-versions = true },
    { crate = "tokio", deny-multiple-versions = true },
    { crate = "sqlx", deny-multiple-versions = true },
]

[advisories]
yanked = "deny"
ignore = [
    # RUSTSEC-2023-0071 (Marvin timing attack in `rsa`): pulled by
    # openidconnect solely for RS256 ID-token *signature verification*
    # (public-key ops); e6ircd never performs RSA decryption, so the
    # decryption-timing sidechannel is not on any exercised path. No
    # fixed `rsa` release exists. Revisit when one ships.
    "RUSTSEC-2023-0071",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
