# Publish the e6irc container image to GHCR for each commit on main whose CI
# succeeded, and publish native daemon/CLI/TUI archives when a version tag is
# pushed for a commit whose CI succeeded.
#
# Nothing is published from unverified code. The image jobs are triggered by
# the completion of the CI workflow (not by the push) and run only when that
# run was a push to main that concluded `success`; they build
# `github.event.workflow_run.head_sha`, because in a `workflow_run` event
# `github.sha` is whatever main points at when CI finishes, not the commit CI
# verified. CI does not run on tag pushes, so the tag path instead requires a
# successful CI run on main for the tagged commit before anything is built.
# CI cancels a superseded run on main, so a commit overtaken by a newer push
# before its CI finished is not published; the newer commit is. To release a
# tag on such a commit, re-run its cancelled CI run first.
#
# Action pins: see the header of ci.yml.
#
# Tagging: each architecture is built natively on its own runner (no QEMU
# emulation, which makes a full Rust release build painfully slow) and pushed
# as `<short-sha>-amd64` / `<short-sha>-arm64`; a final job assembles the
# multi-arch manifest `<short-sha>` from them. No `latest` tag is published.
name: Release image and native archives

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

# Least privilege: every job reads the repository; a job that publishes,
# signs, or deletes names the additional scopes itself.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/e6qu/e6irc

jobs:
  metadata:
    # The `branches` filter above matches the head branch NAME, which a fork's
    # pull request can also call `main`; a push event can only be this
    # repository's own branch.
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.revision.outputs.tag }}
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - id: revision
        env:
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ ! "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "CI did not report the commit it verified: $REVISION" >&2
            exit 1
          fi
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "tag=${REVISION:0:12}" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.revision }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The `<tag>-<arch>` reference is a candidate, not a release artifact:
      # buildx pushes it (the shape check below reads the registry manifest, and
      # buildx's own push is what keeps it a direct OCI image manifest), the
      # check then verifies it, and only the `manifest` job assembles verified
      # candidates into the 12-hex-digit reference operators deploy. A candidate
      # that fails verification is never assembled and is removed by the prune.
      - id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Keep the architecture tags as direct image manifests. Signed
          # provenance and SBOMs are attached as OCI referrers below, so they
          # do not turn these tags into nested indexes.
          provenance: false
          sbom: false
          push: true
          build-args: |
            E6IRC_BUILD_REVISION=${{ needs.metadata.outputs.revision }}
          tags: ${{ env.IMAGE }}:${{ needs.metadata.outputs.tag }}-${{ matrix.arch }}
      - name: Verify the direct architecture image
        run: tools/verify-container-shape.sh "${IMAGE}:${{ needs.metadata.outputs.tag }}" "${{ matrix.arch }}"
      - name: Generate the architecture SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}:${{ needs.metadata.outputs.tag }}-${{ matrix.arch }}
          output-file: sbom-${{ matrix.arch }}.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest architecture build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Attest architecture SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: sbom-${{ matrix.arch }}.spdx.json
          push-to-registry: true
      - name: Verify architecture attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}-${{ matrix.arch }}
        run: |
          gh attestation verify "oci://${IMAGE}:${TAG}" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "oci://${IMAGE}:${TAG}" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://spdx.dev/Document/v2.3

  manifest:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.revision }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble the multi-arch manifest
        env:
          SHA: ${{ needs.metadata.outputs.tag }}
        run: |
          docker buildx imagetools create -t "${IMAGE}:${SHA}" \
            "${IMAGE}:${SHA}-amd64" \
            "${IMAGE}:${SHA}-arm64"
      - name: Verify the multi-architecture manifest
        run: tools/verify-container-shape.sh "${IMAGE}:${{ needs.metadata.outputs.tag }}" manifest
      - name: Resolve the published manifest digest
        id: manifest-digest
        env:
          SHA: ${{ needs.metadata.outputs.tag }}
        run: |
          digest="$(docker buildx imagetools inspect --format '{{json .}}' "${IMAGE}:${SHA}" | jq -r .manifest.digest)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid published manifest digest: $digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest manifest assembly provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest-digest.outputs.digest }}
          push-to-registry: true
      - name: Verify manifest provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.metadata.outputs.tag }}
        run: gh attestation verify "oci://${IMAGE}:${SHA}" --repo "$GITHUB_REPOSITORY"

  prune:
    needs: [metadata, manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.revision }}
      - name: Prune old images (keep newest 20 releases)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/prune-ghcr-versions.sh "${{ github.repository_owner }}" "${{ github.event.repository.name }}" 20

  native-metadata:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      # CI runs on pushes to main and on pull requests, never on a tag, so the
      # tag carries no verdict of its own: require the one main gave this commit.
      - name: Require a successful CI run on main for the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVISION: ${{ github.sha }}
        run: |
          successful="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="$REVISION" -f branch=main -f event=push -f status=success \
            --jq '.total_count')"
          if [[ ! "$successful" =~ ^[0-9]+$ ]] || [ "$successful" -lt 1 ]; then
            echo "no successful CI run on main for $REVISION; refusing to release it" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the tag to match the workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match workspace version $version" >&2
            exit 1
          fi

  native-build:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: native-metadata
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build embedded web client
        run: npm install --global pnpm@11.15.1 && pnpm -C web install --frozen-lockfile && pnpm -C web build
      - name: Build the complete native product
        run: cargo build -p e6ircd --release --all-features --target ${{ matrix.target }}
      - name: Build native clients
        run: cargo build -p e6irc-cli -p e6irc-tui --profile release-client --target ${{ matrix.target }}
      - name: Package deterministic archive
        run: python tools/package-native-release.py --target ${{ matrix.target }}
      - name: Attest archive provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/e6irc-*
      - name: Preserve archive for release assembly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: dist/e6irc-*
          if-no-files-found: error
          retention-days: 7

  native-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: native-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Verify the archive set and write checksums
        run: |
          count="$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)"
          if [ "$count" -ne 6 ]; then
            echo "expected six native archives, found $count" >&2
            find dist -maxdepth 1 -type f -print >&2
            exit 1
          fi
          (cd dist && sha256sum -- ./*.tar.gz ./*.zip | sort -k2 > SHA256SUMS)
      - name: Publish versioned assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job has no checkout, so gh has no git remote to infer the
          # repository from.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --generate-notes --verify-tag --title "e6irc $TAG"
