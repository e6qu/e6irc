# Publish the e6irc container image to GHCR on pushes to main and publish
# native daemon/CLI/TUI archives when a version tag is pushed.
#
# Tagging: each architecture is built natively on its own runner (no QEMU
# emulation, which makes a full Rust release build painfully slow) and pushed
# as `<short-sha>-amd64` / `<short-sha>-arm64`; a final job assembles the
# multi-arch manifest `<short-sha>` from them. No `latest` tag is published.
name: Release image and native archives

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/e6qu/e6irc

jobs:
  metadata:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.revision.outputs.tag }}
    steps:
      - id: revision
        env:
          REVISION: ${{ github.sha }}
        run: |
          tag="${REVISION:0:12}"
          if [[ ! "$tag" =~ ^[0-9a-f]{12}$ ]]; then
            echo "invalid immutable image tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Keep the architecture tags as direct image manifests. Signed
          # provenance and SBOMs are attached as OCI referrers below, so they
          # do not turn these tags into nested indexes.
          provenance: false
          sbom: false
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.metadata.outputs.tag }}-${{ matrix.arch }}
      - name: Verify the direct architecture image
        run: tools/verify-container-shape.sh "${IMAGE}:${{ needs.metadata.outputs.tag }}" "${{ matrix.arch }}"
      - name: Generate the architecture SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.IMAGE }}:${{ needs.metadata.outputs.tag }}-${{ matrix.arch }}
          output-file: sbom-${{ matrix.arch }}.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest architecture build provenance
        uses: actions/attest@v4.2.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Attest architecture SBOM
        uses: actions/attest@v4.2.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: sbom-${{ matrix.arch }}.spdx.json
          push-to-registry: true
      - name: Verify architecture attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}-${{ matrix.arch }}
        run: |
          gh attestation verify "oci://${IMAGE}:${TAG}" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "oci://${IMAGE}:${TAG}" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://spdx.dev/Document/v2.3

  manifest:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble the multi-arch manifest
        env:
          SHA: ${{ needs.metadata.outputs.tag }}
        run: |
          docker buildx imagetools create -t "${IMAGE}:${SHA}" \
            "${IMAGE}:${SHA}-amd64" \
            "${IMAGE}:${SHA}-arm64"
      - name: Verify the multi-architecture manifest
        run: tools/verify-container-shape.sh "${IMAGE}:${{ needs.metadata.outputs.tag }}" manifest
      - name: Resolve the published manifest digest
        id: manifest-digest
        env:
          SHA: ${{ needs.metadata.outputs.tag }}
        run: |
          digest="$(docker buildx imagetools inspect --format '{{json .}}' "${IMAGE}:${SHA}" | jq -r .manifest.digest)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid published manifest digest: $digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest manifest assembly provenance
        uses: actions/attest@v4.2.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest-digest.outputs.digest }}
          push-to-registry: true
      - name: Verify manifest provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.metadata.outputs.tag }}
        run: gh attestation verify "oci://${IMAGE}:${SHA}" --repo "$GITHUB_REPOSITORY"

  prune:
    needs: [metadata, manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Prune old images (keep newest 20 releases)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/prune-ghcr-versions.sh "${{ github.repository_owner }}" "${{ github.event.repository.name }}" 20

  native-metadata:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Require the tag to match the workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match workspace version $version" >&2
            exit 1
          fi

  native-build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native-metadata
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.1
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build embedded web client
        run: npm install --global pnpm@11.15.1 && pnpm -C web install --frozen-lockfile && pnpm -C web build
      - name: Build the complete native product
        run: cargo build -p e6ircd --release --all-features --target ${{ matrix.target }}
      - name: Build native clients
        run: cargo build -p e6irc-cli -p e6irc-tui --profile release-client --target ${{ matrix.target }}
      - name: Package deterministic archive
        run: python tools/package-native-release.py --target ${{ matrix.target }}
      - name: Attest archive provenance
        uses: actions/attest@v4.2.0
        with:
          subject-path: dist/e6irc-*
      - name: Preserve archive for release assembly
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: dist/e6irc-*
          if-no-files-found: error
          retention-days: 7

  native-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Verify the archive set and write checksums
        run: |
          count="$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)"
          if [ "$count" -ne 6 ]; then
            echo "expected six native archives, found $count" >&2
            find dist -maxdepth 1 -type f -print >&2
            exit 1
          fi
          (cd dist && sha256sum -- ./*.tar.gz ./*.zip | sort -k2 > SHA256SUMS)
      - name: Publish versioned assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --generate-notes --verify-tag --title "e6irc $TAG"
