name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.1
      - run: tools/check-systemd-unit.sh
      - run: tools/test-docker-entrypoint.sh
      - run: tools/test-backup-restore.sh
      - run: bash -n tools/load/sweep.sh tools/load/qualify-arguments.sh tools/load/qualify-linux.sh tools/test-load-qualification-arguments.sh tools/test-qualification.sh tools/qualification/*.sh
      - run: tools/test-load-qualification-arguments.sh
      - run: tools/test-qualification.sh
      - run: tools/test-check-migration-integrity.sh
      - name: Migration integrity
        run: |
          git fetch --no-tags --depth=1 origin main
          tools/check-migration-integrity.sh FETCH_HEAD
      # embed-web (pulled in by --all-features) embeds web/dist, so build
      # the frontend first. Node is preinstalled on the runners.
      - run: npm install -g pnpm@11.15.1 && pnpm -C web install --frozen-lockfile && pnpm -C web test && pnpm -C web build
      - run: cargo fmt --all --check
      - run: rustfmt --edition 2024 --check crates/e6irc-qualification/tests/support/native.rs
      - run: cargo clippy --workspace --all-targets --all-features
      # `--all-features` is the union, so it never compiles a bridge on its
      # own. Code behind `cfg(feature = "discord")` that happens to depend on
      # something `matrix` pulls in builds there and breaks for the deployment
      # that enables one bridge, which is the normal case.
      - name: Each bridge feature on its own
        # clippy, not just check: a clippy lint that fires only under one bridge
        # (not in the --all-features union above) would otherwise ship unseen.
        run: |
          for feature in discord matrix slack; do
            cargo clippy -p e6ircd --all-targets --features "$feature"
          done
      # No-op guard (AGENTS.md / DESIGN §2): shipped source must carry no
      # deferred-work markers or unmessaged panics.
      - run: tools/check-noops.sh
      # Dead-code guard: compile only the shipped artifacts (no test targets)
      # with -D warnings, so code kept alive solely by tests is caught as dead.
      - run: tools/check-dead-code.sh
      # Dead-pub guard: the cross-crate case the compiler can't see — a `pub`
      # item referenced only by an integration test (a separate crate).
      - run: tools/check-dead-pub.sh
      # Copy-paste guard: fail if duplicated Rust source exceeds the ratchet.
      - run: tools/check-duplication.sh
      # Journey guard: every user-facing outcome carries the same complete
      # contract and has exactly one row using the defined evidence vocabulary.
      - run: python3 tools/check-journeys.py
      - run: python3 tools/check-client-capabilities.py
      # Structural server-rendered accessibility: every data table keeps an
      # accessible caption and every navigation landmark keeps a name.
      - run: python3 tools/check-template-accessibility.py
      # API-first guard: console forms may not bypass the public API.
      - run: python3 tools/check-api-first-inventory.py
      # No-deferral guard (AGENTS.md): BUGS.md must stay empty and no
      # file-it-for-later idiom may be added to PLAN.md. The checkout is
      # shallow, so fetch main to diff the PLAN.md additions against; the guard
      # still checks BUGS.md if the fetch is unavailable.
      - name: No-deferral guard
        run: |
          git fetch --no-tags --depth=1 origin main 2>/dev/null || true
          tools/check-no-defer.sh FETCH_HEAD

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1

  # Full OS/arch matrix (DESIGN §1): no cell is a second-class port.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.1
      # --all-features includes embed-web, which embeds web/dist.
      - run: npm install -g pnpm@11.15.1 && pnpm -C web install --frozen-lockfile && pnpm -C web build
      - run: cargo test --workspace --all-features --target ${{ matrix.target }}

  # Coverage is a ratchet, not a claim that one percentage proves the product.
  # Combine the portable all-feature suite with the real PostgreSQL database
  # and HTTP lifecycle suites before enforcing it; otherwise production paths
  # whose tests require storage count only in the denominator. Provider/browser
  # journeys still run in their dedicated jobs below.
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: e6irc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready --username postgres --dbname e6irc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2.9.1
      - run: npm install -g pnpm@11.15.1 && pnpm -C web install --frozen-lockfile && pnpm -C web build
      - run: cargo install cargo-llvm-cov --version 0.8.4 --locked
      - name: Measure portable and PostgreSQL-backed production paths
        env:
          E6IRC_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/e6irc_test
        run: |
          cargo llvm-cov --workspace --all-features --no-report
          cargo llvm-cov --no-clean -p e6ircd --all-features --test db -- --ignored --test-threads=1
          cargo llvm-cov --no-clean -p e6ircd --all-features --test http -- --ignored --test-threads=1
      - name: Enforce production-line coverage ratchet
        run: cargo llvm-cov report --summary-only --fail-under-lines 80

  db-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: e6irc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready --username postgres --dbname e6irc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - run: npm install -g pnpm@11.15.1 && pnpm -C web install --frozen-lockfile && pnpm -C web build
      # Each Rust test owns a database created through this administrative URL.
      # Serial binaries keep the service load predictable; the browser may
      # intentionally persist managed state, so the later CLI suite is isolated.
      - run: cargo test -p e6ircd --test db -- --ignored --test-threads=1
        env:
          E6IRC_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/e6irc_test
      - run: cargo test -p e6ircd --test bouncer -- --ignored --test-threads=1
        env:
          E6IRC_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/e6irc_test
      - run: cargo test -p e6ircd --test ws_ui -- --ignored --test-threads=1
        env:
          E6IRC_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/e6irc_test
      - name: Start dex (mock connector)
        run: |
          docker run -d --name dex -p 15556:5556 \
            -v "$PWD/tools/dex-config.yaml:/etc/dex/config.yaml" \
            ghcr.io/dexidp/dex:v2.41.1 dex serve /etc/dex/config.yaml
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:15556/dex/.well-known/openid-configuration >/dev/null && break
            [ "$i" = 30 ] && { echo "dex did not become ready"; docker logs dex; exit 1; }
            sleep 1
          done
      - run: cargo test -p e6ircd --test oidc -- --ignored --test-threads=1
        # covers the dex OIDC flow and the PAT bearer-auth test
        env:
          E6IRC_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/e6irc_test
          E6IRC_TEST_DEX_URL: http://127.0.0.1:15556/dex
      - name: Exercise OIDC in a real browser
        timeout-minutes: 8
        run: |
          browser="$(command -v google-chrome)"
          cargo build -p e6ircd --features embed-web
          PLAYWRIGHT_EXECUTABLE_PATH="$browser" pnpm -C web test:oidc-browser
        env:
          E6IRC_TEST_BROWSER: chromium
          E6IRC_TEST_SERVER_BINARY: target/debug/e6ircd
          E6IRC_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/e6irc_test
          E6IRC_TEST_DEX_URL: http://127.0.0.1:15556/dex
          E6IRC_BROWSER_ARTIFACTS_DIR: test-results/browser
      - name: Retain failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-chromium
          path: test-results/browser
          if-no-files-found: ignore
      - run: cargo test -p e6ircd --all-features --test http -- --ignored --test-threads=1
        env:
          E6IRC_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/e6irc_test
      - run: cargo test -p e6irc-cli --test e2e -- --include-ignored --test-threads=1
        env:
          E6IRC_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/e6irc_test

  cross-browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: e6irc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready --username postgres --dbname e6irc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - run: npm install -g pnpm@11.15.1 && pnpm -C web install --frozen-lockfile && pnpm -C web build
      - name: Start dex (mock connector)
        run: |
          docker run -d --name dex -p 15556:5556 \
            -v "$PWD/tools/dex-config.yaml:/etc/dex/config.yaml" \
            ghcr.io/dexidp/dex:v2.41.1 dex serve /etc/dex/config.yaml
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:15556/dex/.well-known/openid-configuration >/dev/null && break
            [ "$i" = 30 ] && { echo "dex did not become ready"; docker logs dex; exit 1; }
            sleep 1
          done
      - run: cargo build -p e6ircd --features embed-web
      - name: Exercise the complete browser journey in ${{ matrix.browser }}
        timeout-minutes: 8
        run: |
          docker run --rm --network host \
            -v "$PWD:/work" --workdir /work \
            -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            -e E6IRC_TEST_BROWSER="${{ matrix.browser }}" \
            -e E6IRC_TEST_SERVER_BINARY=target/debug/e6ircd \
            -e E6IRC_TEST_DATABASE_URL=postgres://postgres:test@127.0.0.1:5432/e6irc_test \
            -e E6IRC_TEST_DEX_URL=http://127.0.0.1:15556/dex \
            -e E6IRC_BROWSER_ARTIFACTS_DIR=test-results/browser \
            mcr.microsoft.com/playwright:v1.61.1-noble \
            node tools/test-oidc-browser.mjs
      - name: Retain failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ matrix.browser }}
          path: test-results/browser
          if-no-files-found: ignore

  visual-regression:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: npm install -g pnpm@11.15.1 && pnpm -C web install --frozen-lockfile
      - name: Install Chromium for visual regression
        run: pnpm -C web exec playwright install chromium
      - run: pnpm -C web test:visual
      - name: Retain failed visual diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diagnostics
          path: web/test-results
          if-no-files-found: ignore

  # A service-container job cannot stop its own PostgreSQL dependency safely.
  # This isolated process journey owns a named disposable container so it can
  # prove fresh migration/bootstrap, interruption, hot IRC continuity, honest
  # readiness/API failure, pool recovery, and graceful shutdown together.
  postgres-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo build -p e6ircd
      - run: python3 tools/test-postgres-recovery.py

  production-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg E6IRC_BUILD_REVISION="${{ github.sha }}" --tag e6irc:ci .
      - name: Verify the fully baked web client
        run: |
          container_id="$(docker create e6irc:ci)"
          trap 'docker rm "$container_id" >/dev/null' EXIT
          docker cp "$container_id:/usr/local/bin/e6ircd" /tmp/e6ircd
          strings /tmp/e6ircd | grep -F "Open my account"
      - run: tools/test-prune-ghcr-versions.sh

  load-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo build -p e6ircd -p e6irc-load
      - run: tools/test-load-smoke.sh

  native-client-journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - run: python3 tools/test-native-release-package.py
      - run: cargo build -p e6ircd -p e6irc-tui
      - run: python3 tools/test-tui-pty.py

  shauth-sso:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - uses: actions/checkout@v7
        with:
          repository: e6qu/shauth
          ref: 0fda680cba964e5768ed75a9c3e5b7230c418ca6
          path: .test-deps/shauth
      - run: npm install --global pnpm@11.15.1
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web build && cargo build -p e6ircd --features embed-web
      - name: Exercise exact Shauth single sign-on and global logout
        timeout-minutes: 8
        run: |
          browser="$(command -v google-chrome)"
          PLAYWRIGHT_EXECUTABLE_PATH="$browser" \
            SHAUTH_SOURCE_DIR="$GITHUB_WORKSPACE/.test-deps/shauth" \
            tools/test-shauth-sso.sh

  # Protocol conformance against the pinned irctest suite (vendored
  # hookup in vendor/tests/irctest/) with the standard irctest marker
  # filter. Grow the file list as surface lands; removing a file needs a
  # written reason.
  irctest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo build -p e6ircd
      - name: Check out pinned irctest
        run: |
          # Retry the clone: a transient GitHub hiccup should not fail the job.
          for attempt in 1 2 3; do
            rm -rf ../irctest
            git clone https://github.com/progval/irctest ../irctest && break
            [ "$attempt" = 3 ] && { echo "irctest clone failed after 3 attempts"; exit 1; }
            sleep 5
          done
          git -C ../irctest checkout a468d9fcd64abc72b02ecb20f4f8612fd72c8829
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"
      - name: Run irctest green list
        run: |
          pip install -r ../irctest/requirements.txt "pytest-timeout==2.4.0"
          vendor/tests/irctest/run.sh ../irctest "$(command -v python)"

  # The persistence-backed half of the conformance suite: the suites marked
  # `services` need an account store, so they run against a real PostgreSQL
  # with E6IRC_IRCTEST_DB set (the controller then embeds a [database]
  # section, advertises SASL, and truncates between servers). Same green-list
  # rule as above; each deselect below names why, and removing one needs a
  # written reason.
  irctest-services:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: irctest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready --username postgres --dbname irctest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo build -p e6ircd
      - name: Check out pinned irctest
        run: |
          # Retry the clone: a transient GitHub hiccup should not fail the job.
          for attempt in 1 2 3; do
            rm -rf ../irctest
            git clone https://github.com/progval/irctest ../irctest && break
            [ "$attempt" = 3 ] && { echo "irctest clone failed after 3 attempts"; exit 1; }
            sleep 5
          done
          git -C ../irctest checkout a468d9fcd64abc72b02ecb20f4f8612fd72c8829
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"
      - name: Run persistence-backed irctest green list
        working-directory: ../irctest
        run: |
          pip install -r requirements.txt "pytest-timeout==2.4.0"
          PATH="$GITHUB_WORKSPACE/target/debug:$PATH" \
          PYTHONPATH="$GITHUB_WORKSPACE/vendor/tests/irctest" \
          E6IRC_IRCTEST_DB="postgres://postgres:test@127.0.0.1:5432/irctest" \
          pytest --controller=e6ircd_controller --timeout=20 \
            -m 'not implementation-specific and not deprecated and not strict' \
            `# irctest registers accounts over a normal PRIVMSG, so a 592-byte` \
            `# password cannot fit the 512-byte line limit; e6ircd correctly` \
            `# answers ERR_INPUTTOOLONG and the account is never created.` \
            --deselect 'irctest/server_tests/sasl.py::SaslTestCase::testPlainLarge800' \
            `# e6ircd's services are integrated, not a linked second server, so` \
            `# there is no My.Little.Services entry for LINKS to report (the` \
            `# same reason the test notes for Ergo).` \
            --deselect 'irctest/server_tests/links.py::ServicesLinksTestCase::testLinksWithServices' \
            `# These two need Ergo always-on multiclient: two live sessions share` \
            `# one nick and resume channels with a MARKREAD replay. e6irc's` \
            `# multiclient surface is the BNC attach layer, not same-nick core` \
            `# sessions, so the core daemon legitimately refuses the second NICK.` \
            --deselect 'irctest/server_tests/read_marker.py::ReadMarkerServiceTestCase::testReadMarkerPersistsAcrossReconnect' \
            --deselect 'irctest/server_tests/read_marker.py::ReadMarkerServiceTestCase::testReadMarkerPropagatedToOtherSessions' \
            irctest/server_tests/sasl.py \
            irctest/server_tests/chathistory.py \
            irctest/server_tests/links.py \
            irctest/server_tests/account_registration.py \
            irctest/server_tests/extended_join.py \
            irctest/server_tests/account_tag.py \
            irctest/server_tests/monitor.py \
            irctest/server_tests/read_marker.py \
            irctest/server_tests/who.py \
            irctest/server_tests/whois.py

  # Matrix bridge (feature-gated) against a pinned Conduit homeserver.
  # Conduit v0.9.0 needs a config file, so it is started with docker run
  # (after checkout) mounting the repo's vendored config.
  matrix-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - name: Start Conduit
        run: |
          docker run -d --name conduit -p 16167:6167 \
            -e CONDUIT_CONFIG=/etc/conduit.toml \
            -v "$PWD/vendor/tests/external-oracles/conduit/conduit.toml:/etc/conduit.toml:ro" \
            matrixconduit/matrix-conduit:v0.9.0
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:16167/_matrix/client/versions >/dev/null && break
            [ "$i" = 40 ] && { echo "conduit did not become ready"; docker logs conduit; exit 1; }
            sleep 1
          done
      - run: cargo test -p e6ircd --features matrix --test matrix -- --ignored
        env:
          E6IRC_TEST_MATRIX_URL: http://127.0.0.1:16167

  loom:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo test -p e6irc-queue --release
        env:
          RUSTFLAGS: --cfg loom -Dwarnings

  # `core_dispatch` and `core_multi` differ from the parser targets: they drive
  # the stateful core with a command stream, where a line's effect depends on
  # every line before it. `core_multi` adds the parts only reachable with more
  # than one connection (collisions, kicks, conversations, relayed batches) and
  # the events no client sends — the liveness tick and deferred database pages.
  # Any panic is a finding: one worker serves every client, so a panic reached
  # through any connection takes down all of them.
  #
  # `client_messages` runs the other direction: it feeds the TUI arbitrary
  # *server* output. A client's whole state is derived from lines a remote
  # server chose, and that server is not necessarily this one.
  fuzz-smoke:
    runs-on: ubuntu-24.04
    # `core_dispatch` links the whole daemon (sqlx, rustls) rather than just the
    # protocol crate, so a cold cache spends most of the budget compiling.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Pinned nightly: the 2026-07-24 nightly ICEs in rustc_codegen_ssa on a
      # tokio task type under the fuzzer's ASAN+sancov instrumentation (a
      # compiler bug, not our code). Pin to the last nightly that built the fuzz
      # targets; bump when upstream fixes the codegen regression.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-23
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz each target briefly
        working-directory: fuzz
        # Enumerate targets from cargo-fuzz itself (the Cargo.toml [[bin]] set)
        # rather than a hand-maintained list, so a newly-added target can never
        # silently go un-fuzzed — serialize_message did exactly that under the
        # old hardcoded list.
        run: |
          targets="$(cargo +nightly-2026-07-23 fuzz list)"
          test -n "$targets" || { echo "no fuzz targets found"; exit 1; }
          for target in $targets; do
            cargo +nightly-2026-07-23 fuzz run "$target" -- -max_total_time=30
          done

  # Informational only — no threshold (DESIGN §6).
  size-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo build --release --workspace
      - name: Report stripped binary sizes
        run: |
          {
            echo '### Binary sizes (release, stripped)'
            echo '| binary | size |'
            echo '|---|---|'
            for bin in e6ircd e6irc e6irc-tui; do
              if [ -f "target/release/$bin" ]; then
                echo "| $bin | $(du -h "target/release/$bin" | cut -f1) |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
