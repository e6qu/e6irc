[package]
name = "e6irc-qualification"
description = "External qualification evidence runner"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "e6irc-qualification"
path = "src/main.rs"

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2"
