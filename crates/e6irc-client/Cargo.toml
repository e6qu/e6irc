[package]
name = "e6irc-client"
description = "IRC client library: connection, TLS, SASL, chathistory (shared by CLI and TUI)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
e6irc-proto = { path = "../e6irc-proto" }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.150", default-features = false, features = ["std"] }
# tokio 1.53.0 (>24h): shared async connection for CLI and TUI.
tokio = { version = "1.53.0", default-features = false, features = [
    "rt",
    "net",
    "io-util",
    "time",
    "macros",
] }
rustls = { version = "0.23.45", default-features = false, features = [
    "aws_lc_rs",
    "tls12",
    "std",
] }
tokio-rustls = { version = "0.26.4", default-features = false, features = [
    "aws_lc_rs",
    "tls12",
] }
rustls-pki-types = { version = "1.15.0", default-features = false, features = [
    "std",
] }
# webpki-roots 1.0.9 (2026-07-18, >24h; checked against crates.io on
# 2026-09-20, when it was still the newest release): the Mozilla CA bundle the
# clients verify public IRC and HTTPS servers against.
webpki-roots = { version = "1.0.9", default-features = false }

[target.'cfg(windows)'.dependencies]
# Atomic replacement of a cached bearer token on Windows. Unix rename already
# has replace semantics; MoveFileExW supplies the same contract on NTFS.
windows-sys = { version = "0.61.2", default-features = false, features = [
    "Win32_Storage_FileSystem",
] }
