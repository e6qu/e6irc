[package]
name = "e6irc-tui"
description = "Terminal UI client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
e6irc-client = { path = "../e6irc-client" }
e6irc-proto = { path = "../e6irc-proto" }
# ratatui 0.30.2 (2026-06-19), crossterm 0.29.0 — verified >24h.
ratatui = { version = "0.30.2", default-features = false, features = [
    "crossterm",
] }
# `bracketed-paste`: a paste arrives as one event, so a multi-line paste can
# be refused whole instead of being sent line by line.
crossterm = { version = "0.29.0", default-features = false, features = [
    "events",
    "bracketed-paste",
] }
unicode-width = "0.2.2"
tokio = { version = "1.53.0", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
    "sync",
    "macros",
    # SIGTERM/SIGINT/SIGHUP end the UI like /quit: QUIT sent, terminal restored.
    "signal",
] }
clap = { version = "4.6.2", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }

[dev-dependencies]
# Paused time for the liveness tests: a three-minute window runs in no time.
tokio = { version = "1.53.0", default-features = false, features = [
    "test-util",
] }
