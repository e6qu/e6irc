{% if networks.is_empty() %}
  <tbody id="cnetworks"><tr><td colspan="7" class="empty">No networks yet. Add one above.</td></tr></tbody>
{% else %}
  <tbody id="cnetworks">
    {% for n in networks %}
      <tr>
        <td>
          <span class="dot {% if n.connected %}on{% else %}off{% endif %}"></span>{{ n.state }}
        </td>
        <td><a class="rowlink" href="/console/networks/{{ n.name }}">{{ n.name }}</a></td>
        <td><span class="tag">{{ n.kind }}</span></td>
        <td><code>{{ n.addr }}</code>{% if n.tls %} <span class="tag">TLS</span>{% endif %}</td>
        <td>{{ n.attached_clients }}</td>
        <td>{{ n.errors }}</td>
        <td class="row-actions">
          <a class="rowlink" href="/console/networks/{{ n.name }}">Inspect</a>
          <form method="post" action="/console/networks/{{ n.name }}/toggle">
            <input type="hidden" name="csrf" value="{{ csrf }}" />
            <input type="hidden" name="enabled" value="{% if n.enabled %}false{% else %}true{% endif %}" />
            <button type="submit">{% if n.enabled %}Disable{% else %}Enable{% endif %}</button>
          </form>
          <form method="post" action="/console/networks/{{ n.name }}/delete" data-confirm="Remove network {{ n.name }}? This also stops its live connection.">
            <input type="hidden" name="csrf" value="{{ csrf }}" />
            <button class="danger" type="submit">Remove</button>
          </form>
        </td>
      </tr>
    {% endfor %}
  </tbody>
{% endif %}
