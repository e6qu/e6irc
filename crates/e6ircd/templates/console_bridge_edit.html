{% extends "console_base.html" %}
{% block main %}
  <div data-api-owner-bridge-editor data-network-name="{{ name }}">
  <p id="network-api-result" role="status" aria-live="polite"></p>
  <noscript><div class="banner-error">JavaScript is required because this page reads and changes bridge data through the owner API.</div></noscript>
  <div class="page-head">
    <div>
      <p class="eyebrow" data-bridge-kind>Bridge</p>
      <h1 data-bridge-editor-title>Loading integration…</h1>
      <p class="lede">Saving validates the complete bridge configuration before replacing its live connection.</p>
    </div>
    <a class="button-link secondary-link" href="/console/integrations">All integrations</a>
  </div>
  <section class="panel">
    <form class="network-form" method="post" data-api-owner-bridge-update hidden>
      <input type="hidden" name="csrf" value="{{ shell.csrf }}" />
      <label class="field field-wide">
        <span>Homeserver / API base <em>optional</em></span>
        <input name="addr" placeholder="Provider default" />
        <small>Use the provider endpoint required by this integration.</small>
      </label>
      <label class="field" data-bridge-nick><span>Provider user</span><input name="nick" autocomplete="username" /></label>
      <label class="field field-wide"><span>Rooms / channel IDs <em>optional</em></span><input name="autojoin" /><small>Comma-separated; the expected identifier depends on the provider.</small></label>
      <label class="field" data-bridge-account hidden><span>New provider account token <em>optional</em></span><input type="password" name="sasl_account" autocomplete="new-password" maxlength="255" /><small data-bridge-account-status>Leave blank to keep an existing stored token.</small></label>
      <label class="field">
        <span>New provider credential <em>optional</em></span>
        <input type="password" name="sasl_password" autocomplete="new-password" maxlength="512" />
        <small data-bridge-credential>Leave blank to keep an existing stored credential.</small>
      </label>
      <div class="form-actions field-wide"><button class="primary" type="submit">Save bridge</button><a class="rowlink" href="/console/integrations">Cancel</a></div>
    </form>
  </section>
  </div>
{% endblock %}
