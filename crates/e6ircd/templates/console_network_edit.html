{% extends "console_base.html" %}
{% block main %}
      <div data-api-owner-network-editor data-network-name="{{ name }}">
        <p id="network-api-result" role="status" aria-live="polite"></p>
        <noscript><div class="banner-error">JavaScript is required because this page reads and changes network data through the owner API.</div></noscript>
        <div class="page-head"><div><p class="eyebrow">IRC network</p><h1 data-network-editor-title>Loading network…</h1><p class="lede">The network reconnects with the new values when you save.</p></div></div>
        <section class="panel">
        <form class="network-form" method="post" data-api-owner-network-update hidden>
          <input type="hidden" name="csrf" value="{{ shell.csrf }}" />
          <label class="field field-wide"><span>Nickname</span><input name="nick" autocomplete="nickname" maxlength="64" required /></label>
          <label class="field"><span>NickServ account <em>optional</em></span><input name="sasl_account" autocomplete="username" maxlength="255" data-sasl-account /></label>
          <label class="field"><span>New NickServ password <em>optional</em></span><input type="password" name="sasl_password" autocomplete="new-password" maxlength="512" data-sasl-password /><small>Leave blank to keep the stored password.</small></label>
          <label class="check field-wide"><input type="checkbox" name="clear_sasl" data-sasl-clear /><span><strong>Remove the stored account and password</strong></span></label>
          <label class="field field-wide"><span>Channels to join <em>optional</em></span><input name="autojoin" autocomplete="off" /><small>Comma-separated channel names.</small></label>
          <details class="advanced field-wide" data-network-advanced>
            <summary>Advanced</summary>
            <div class="field-grid">
              <label class="field field-wide"><span>Server</span><input name="addr" autocomplete="off" maxlength="255" required /></label>
              <label class="check field-wide"><input type="checkbox" name="tls" /><span><strong>Use TLS</strong><small>Recommended for public IRC networks.</small></span></label>
              <label class="field field-wide"><span>Real name <em>optional</em></span><input name="realname" autocomplete="name" maxlength="128" /></label>
            </div>
          </details>
          <div class="form-actions field-wide"><button class="primary" type="submit">Save changes</button><a class="rowlink" href="/console/networks">Cancel</a></div>
        </form>
        </section>
      </div>
{% endblock %}
