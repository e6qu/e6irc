{% extends "console_base.html" %}
{% block main %}
        {% if let Some(err) = error %}
          <p class="banner-error" role="alert">{{ err }}</p>
        {% endif %}
        <h1>Edit network <code>{{ name }}</code></h1>
        <p class="meta">
          Change the upstream connection and identity. SASL credentials are not
          edited here — to change them, remove and re-add the network.
        </p>
        <form class="add" method="post" action="/console/networks/{{ name }}/edit">
          <input type="hidden" name="csrf" value="{{ csrf }}" />
          <input type="text" name="addr" value="{{ addr }}" placeholder="host:port" required />
          <input type="text" name="nick" value="{{ nick }}" placeholder="nick" required />
          <input type="text" name="realname" value="{{ realname }}" placeholder="real name (optional)" />
          <input type="text" name="autojoin" value="{{ autojoin }}" placeholder="#chan,#chan2" />
          <label><input type="checkbox" name="tls"{% if tls %} checked{% endif %} /> TLS</label>
          <button type="submit">Save changes</button>
          <a href="/console/networks">Cancel</a>
        </form>
{% endblock %}
