{% extends "console_base.html" %}
{% block main %}
      <div data-api-owner-network-editor data-network-name="{{ name }}">
        <p id="network-api-result" role="status" aria-live="polite"></p>
        <noscript><div class="banner-error">JavaScript is required because this page reads and changes network data through the owner API.</div></noscript>
        <div class="page-head"><div><p class="eyebrow">IRC network</p><h1 data-network-editor-title>Loading network…</h1><p class="lede">Saving replaces the live upstream connection after the new values are validated.</p></div></div>
        <section class="panel">
        <form class="network-form" method="post" data-api-owner-network-update hidden>
          <input type="hidden" name="csrf" value="{{ shell.csrf }}" />
          <label class="field"><span>Server and port</span><input name="addr" required /></label>
          <label class="field"><span>Nickname</span><input name="nick" required /></label>
          <label class="field field-wide"><span>Real name</span><input name="realname" required /></label>
          <label class="field field-wide"><span>Channels to join <em>optional</em></span><input name="autojoin" /><small>Comma-separated channel names.</small></label>
          <label class="field"><span>Upstream SASL account <em>optional</em></span><input name="sasl_account" autocomplete="username" maxlength="255" data-sasl-account /></label>
          <label class="field"><span>New SASL password <em>optional</em></span><input type="password" name="sasl_password" autocomplete="new-password" maxlength="512" data-sasl-password /><small>Leave blank to keep an existing stored password; required when adding credentials.</small></label>
          <label class="check field-wide"><input type="checkbox" name="clear_sasl" data-sasl-clear /><span><strong>Remove stored SASL credentials</strong><small>The stored account and encrypted password will both be removed.</small></span></label>
          <label class="check field-wide"><input type="checkbox" name="tls" /><span><strong>Use TLS</strong><small>Recommended for public IRC networks.</small></span></label>
          <div class="form-actions field-wide"><button class="primary" type="submit">Save changes</button><a class="rowlink" href="/console/networks">Cancel</a></div>
        </form>
        </section>
      </div>
{% endblock %}
