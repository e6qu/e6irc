<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>e6irc — console</title>
    <script src="/htmx.min.js" defer></script>
    <style>
      :root { color-scheme: light dark; --border: #d9dde3; --muted: #5b6470; --accent: #2f6feb;
        --bg: #f6f7f9; --fg: #16181d; --panel: #fff; --ok: #1a8f4c; --off: #b23b3b; }
      @media (prefers-color-scheme: dark) { :root { --border: #262b33; --muted: #9aa3b1;
        --bg: #0f1115; --fg: #e6e8ec; --panel: #14171d; --ok: #3fbf72; --off: #e06666; } }
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.6 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
      header { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
        padding: 0.75rem 1.25rem; border-bottom: 1px solid var(--border); }
      header .brand { font-weight: 700; letter-spacing: 0.02em; }
      header .who { color: var(--muted); }
      header a { color: var(--accent); text-decoration: none; }
      .layout { display: flex; align-items: flex-start; gap: 0; }
      nav { flex: 0 0 13rem; padding: 1rem 0.75rem; border-right: 1px solid var(--border);
        position: sticky; top: 0; align-self: stretch; min-height: calc(100vh - 3.1rem); }
      nav a { display: block; padding: 0.4rem 0.7rem; border-radius: 0.4rem; color: var(--fg);
        text-decoration: none; margin-bottom: 0.15rem; }
      nav a:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
      nav a.active { background: color-mix(in srgb, var(--accent) 18%, transparent); font-weight: 600; }
      nav .section { color: var(--muted); font-size: 0.72rem; text-transform: uppercase;
        letter-spacing: 0.06em; margin: 1rem 0.7rem 0.35rem; }
      main { flex: 1 1 auto; padding: 1.25rem 1.5rem; min-width: 0; max-width: 64rem; }
      h1 { font-size: 1.3rem; margin: 0 0 1rem; }
      h2 { font-size: 1.05rem; margin: 2rem 0 0.5rem; padding-top: 0.5rem; }
      .cards { display: flex; flex-wrap: wrap; gap: 0.75rem; margin: 0.5rem 0 0.5rem; }
      .card { flex: 1 1 8rem; background: var(--panel); border: 1px solid var(--border);
        border-radius: 0.6rem; padding: 0.8rem 1rem; }
      .card .n { font-size: 1.6rem; font-weight: 700; }
      .card .l { color: var(--muted); font-size: 0.8rem; }
      .scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 0.6rem; }
      table { width: 100%; border-collapse: collapse; background: var(--panel); }
      th, td { text-align: left; padding: 0.45rem 0.7rem; border-bottom: 1px solid var(--border);
        white-space: nowrap; }
      th { color: var(--muted); font-weight: 600; font-size: 0.78rem; }
      tr:last-child td { border-bottom: none; }
      .empty { color: var(--muted); padding: 0.6rem 0; }
      code { font-family: ui-monospace, Menlo, monospace; }
      .meta { color: var(--muted); font-size: 0.85rem; }
      .tag { display: inline-block; font-size: 0.72rem; border: 1px solid var(--border);
        border-radius: 0.6rem; padding: 0 0.4rem; color: var(--muted); }
      .dot { display: inline-block; width: 0.55rem; height: 0.55rem; border-radius: 50%;
        margin-right: 0.35rem; vertical-align: baseline; background: var(--muted); }
      .dot.on { background: var(--ok); } .dot.off { background: var(--off); }
      form.add { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.75rem 0; align-items: center; }
      form.add input[type=text] { padding: 0.4rem 0.6rem; border: 1px solid var(--border);
        border-radius: 0.4rem; background: transparent; color: inherit; }
      form.add label { display: flex; align-items: center; gap: 0.3rem; color: var(--muted); }
      button { padding: 0.4rem 0.9rem; border: 1px solid var(--border); border-radius: 0.4rem;
        background: transparent; color: inherit; cursor: pointer; }
      form.add button { background: var(--accent); color: #fff; border: none; font-weight: 600; }
      button.danger { color: var(--off); border-color: var(--off); background: transparent; }
      form.add select { padding: 0.4rem 0.6rem; border: 1px solid var(--border);
        border-radius: 0.4rem; background: transparent; color: inherit; }
      .cell-form { display: inline; margin: 0; }
      .banner-error { background: color-mix(in srgb, var(--off) 15%, transparent);
        border: 1px solid var(--off); color: var(--fg); padding: 0.5rem 0.8rem;
        border-radius: 0.5rem; margin: 0 0 1rem; }
      @media (max-width: 40rem) {
        .layout { flex-direction: column; }
        nav { flex-basis: auto; width: 100%; position: static; min-height: 0;
          border-right: none; border-bottom: 1px solid var(--border);
          display: flex; flex-wrap: wrap; gap: 0.25rem; }
        nav .section { width: 100%; margin: 0.5rem 0.7rem 0.15rem; }
        main { padding: 1rem; }
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand" aria-label="e6irc">e6irc console</span>
      <span>
        <span class="who" data-shauth-user="{{ account }}">{{ account }}</span>
        &nbsp;·&nbsp;
        <a data-shauth-sign-out href="/api/v1/auth/logout?csrf={{ csrf }}">Sign out</a>
      </span>
    </header>
    <div class="layout">
      <nav>
        {% if is_admin %}
          <div class="section">Server</div>
          <a href="/console"{% if active == "overview" %} class="active"{% endif %}>Overview</a>
          <a href="/console/sessions"{% if active == "sessions" %} class="active"{% endif %}>Sessions</a>
          <a href="/console/integrations"{% if active == "integrations" %} class="active"{% endif %}>Integrations</a>
        {% endif %}
        <div class="section">You</div>
        <a href="/console/networks"{% if active == "networks" %} class="active"{% endif %}>BNC networks</a>
        <a href="/account">Account &amp; keys</a>
      </nav>
      <main>
        {% block main %}{% endblock %}
      </main>
    </div>
    {% include "_toast.html" %}
  </body>
</html>
